<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin &ndash; Point da Aldeia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--card:#1e1e1e;
  --border:#2a2a2a;--primary:#ff0000;--primary-d:#cc0000;
  --text:#f0f0f0;--text2:#aaa;--success:#00e676;--warning:#ffb300;
  --danger:#ff1744;--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(ellipse at top,#2a1000,#0d0d0d 70%);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:380px;text-align:center;}
.login-card .logo{font-size:2.5rem;margin-bottom:.5rem;}
.login-card h1{font-size:1.4rem;font-weight:800;margin-bottom:.2rem;}
.login-sub{color:var(--text2);font-size:.88rem;margin-bottom:2rem;}
.back-link{display:block;margin-top:1.2rem;color:var(--text2);font-size:.85rem;}
.back-link:hover{color:var(--primary);}

/* LAYOUT */
.admin-layout{display:flex;min-height:100vh;}
.sidebar{width:240px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:50;transition:transform .3s;}
.sidebar.collapsed{transform:translateX(-240px);}
.sidebar-header{padding:1.1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-logo{font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:.4rem;}
.sidebar-logo span{color:var(--primary);}
.sidebar-close{background:none;border:none;color:var(--text2);font-size:1rem;display:none;}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto;}
.nav-group-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);padding:.4rem 1.25rem;margin-top:.4rem;}
.nav-item{display:flex;align-items:center;gap:.65rem;padding:.6rem 1.25rem;color:var(--text2);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:.875rem;border-left:3px solid transparent;transition:all .18s;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{color:var(--primary);background:rgba(232,86,10,.1);border-left-color:var(--primary);}
.nav-item i{width:18px;text-align:center;font-size:.9rem;}
.sidebar-footer{padding:.9rem 1.25rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--text2);}
.sidebar-footer strong{display:block;color:var(--text);font-size:.875rem;}

/* CONTENT */
.content-wrap{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:40;background:rgba(13,13,13,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;padding:0 1.5rem;height:54px;}
.menu-btn{background:none;border:none;color:var(--text);font-size:1.2rem;display:none;}
.topbar-title{font-size:1rem;font-weight:700;flex:1;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--text2);padding:.32rem .85rem;border-radius:8px;font-size:.82rem;}
.btn-logout:hover{border-color:var(--danger);color:var(--danger);}
.admin-content{padding:1.75rem;flex:1;}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-bottom:1.75rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;}
.stat-icon{font-size:1.8rem;margin-bottom:.4rem;}
.stat-val{font-size:1.5rem;font-weight:800;}
.stat-label{font-size:.78rem;color:var(--text2);margin-top:.15rem;}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.75rem;}
.table-header{padding:.9rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;}
.table-header h2{font-size:.95rem;font-weight:700;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.875rem;}
thead tr{background:var(--bg3);}
th{padding:.65rem .9rem;text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);white-space:nowrap;}
td{padding:.65rem .9rem;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.015);}

/* BADGES */
.badge{display:inline-block;padding:.18rem .55rem;border-radius:50px;font-size:.73rem;font-weight:600;}
.badge-success{background:rgba(0,230,118,.15);color:var(--success);}
.badge-warning{background:rgba(255,179,0,.15);color:var(--warning);}
.badge-danger{background:rgba(255,23,68,.15);color:var(--danger);}
.badge-info{background:rgba(232,86,10,.15);color:var(--primary);}

/* BUTTONS */
.btn-primary{background:var(--primary);color:#fff;border:none;padding:.5rem 1.1rem;border-radius:8px;font-weight:600;font-size:.875rem;}
.btn-primary:hover{background:var(--primary-d);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);padding:.45rem .9rem;border-radius:8px;font-size:.82rem;}
.btn-secondary:hover{border-color:var(--primary);}
.btn-danger{background:rgba(255,23,68,.1);color:var(--danger);border:1px solid rgba(255,23,68,.25);padding:.38rem .75rem;border-radius:6px;font-size:.82rem;}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-edit{background:rgba(232,86,10,.1);color:var(--primary);border:1px solid rgba(232,86,10,.25);padding:.38rem .75rem;border-radius:6px;font-size:.82rem;}
.btn-edit:hover{background:var(--primary);color:#fff;}
.actions-col{display:flex;gap:.4rem;flex-wrap:wrap;}

/* FORMS */
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:.28rem;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.55rem .85rem;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.875rem;transition:border .2s;}
.form-group textarea{resize:vertical;min-height:80px;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);outline:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-erro{color:var(--danger);font-size:.82rem;min-height:1.1em;}
.toggle-switch{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;}
.toggle-switch input{display:none;}
.toggle-track{width:38px;height:20px;background:var(--border);border-radius:10px;transition:background .2s;position:relative;}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;}
.toggle-switch input:checked~.toggle-track{background:var(--primary);}
.toggle-switch input:checked~.toggle-track::after{left:21px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.75rem;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:1.1rem;font-weight:800;margin-bottom:1.25rem;}
.modal-footer{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.25rem;padding-top:.9rem;border-top:1px solid var(--border);}

/* MISC */
.search-input{padding:.45rem .85rem;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;outline:none;width:200px;}
.search-input:focus{border-color:var(--primary);}
.loading{text-align:center;padding:3rem;color:var(--text2);}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem;}
.toast{background:var(--card);border:1px solid var(--border);padding:.65rem 1.1rem;border-radius:10px;font-size:.85rem;animation:slideIn .3s ease;min-width:200px;}
.toast.success{border-color:var(--success);color:var(--success);}
.toast.error{border-color:var(--danger);color:var(--danger);}
.toast.warning{border-color:var(--warning);color:var(--warning);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.empty-row td{text-align:center;color:var(--text2);padding:2.5rem;font-size:.9rem;}

@media(max-width:900px){
  .sidebar{transform:translateX(-240px);}
  .sidebar.open{transform:translateX(0);}
  .content-wrap{margin-left:0;}
  .menu-btn{display:block;}
  .sidebar-close{display:block;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="login-screen">

    <div class="logo">&#9881;</div>
    <h1>Painel Admin</h1>

      <div class="form-group"><label>Usu&aacute;rio</label><input type="text" id="loginUser" placeholder="admin" required autocomplete="username"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="••••••" required autocomplete="current-password"></div>

      <button type="submit" class="btn-primary" style="width:100%;padding:.65rem;font-size:.95rem;">Entrar</button>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar &agrave; loja</a>

</div>

<!-- ===== PAINEL ===== -->
<div id="adminPanel" style="display:none" class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

      <div class="sidebar-logo">&#127869; <span>POINT</span>&nbsp;ADMIN</div>
      <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">Geral</div>

      <button class="nav-item" id="nav-categorias" onclick="ir('categorias')"><i class="fas fa-tags"></i> Categorias</button>
      <button class="nav-item" id="nav-produtos" onclick="ir('produtos')"><i class="fas fa-utensils"></i> Produtos</button>

      <div class="nav-group-label">Opera&ccedil;&atilde;o</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)fecharModal()">

</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* Proteção básica no admin — sem bloquear DevTools pois é painel do dono */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', function(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  // Bloqueia Ctrl+U (ver fonte) e Ctrl+S (salvar)
  if (ctrl && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
    e.preventDefault(); return false;
  }
});
// Bloqueia ser embutido em iframe
if (window.self !== window.top) { window.top.location = window.self.location; }
</script>

<script>
/* =============================================
   AUTENTICAÇÃO — SHA-256 + bloqueio por tentativas
   ============================================= */

// Hash SHA-256 de "aldeia123" — gerado com crypto.subtle
// Para trocar: https://emn178.github.io/online-tools/sha256.html
const SENHA_HASH = '680885d41d2490517923ab9c343c950bfec3275ab61cb0d467f98b23a74ee240';

async function hashSenha(senha) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(senha));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

let logado = false;
let tentativas = parseInt(sessionStorage.getItem('adm_t') || '0');

async function fazerLogin(e) {
  e.preventDefault();
  const erroEl = document.getElementById('loginErro');
  if (tentativas >= 5) {
    erroEl.textContent = 'Acesso bloqueado. Aguarde 30 segundos.';
    return;
  }
  const user  = document.getElementById('loginUser').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const hash  = await hashSenha(senha);
  if (user === 'admin' && hash === SENHA_HASH) {
    tentativas = 0;
    sessionStorage.removeItem('adm_t');
    logado = true;
    sessionStorage.setItem('adminLogado','1');
    sessionStorage.setItem('adminTs', Date.now().toString());
    initDefaultData();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display  = 'flex';
    document.getElementById('sidebarFooter').innerHTML   = '<strong>Administrador</strong><br>Point da Aldeia';
    ir('dashboard');
  } else {
    tentativas++;
    sessionStorage.setItem('adm_t', tentativas);
    const r = 5 - tentativas;
    if (r > 0) {
      erroEl.textContent = 'Senha incorreta. (' + r + ' tentativa' + (r > 1 ? 's' : '') + ' restante' + (r > 1 ? 's' : '') + ')';
    } else {
      erroEl.textContent = 'Bloqueado por 30 segundos.';
      setTimeout(() => { tentativas = 0; sessionStorage.setItem('adm_t','0'); erroEl.textContent = ''; }, 30000);
    }
  }
}

function sair() {
  logado = false;
  sessionStorage.removeItem('adminLogado');
  sessionStorage.removeItem('adminTs');
  document.getElementById('adminPanel').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function checarSessao() {
  const ts = parseInt(sessionStorage.getItem('adminTs') || '0');
  if (ts && Date.now() - ts > 2 * 60 * 60 * 1000) sair();
}
setInterval(checarSessao, 60000);

document.addEventListener('DOMContentLoaded', function () {
  if (sessionStorage.getItem('adminLogado') === '1') {
    checarSessao();
    if (sessionStorage.getItem('adminLogado') === '1') {
      logado = true;
      initDefaultData();
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display  = 'flex';
      document.getElementById('sidebarFooter').innerHTML   = '<strong>Administrador</strong><br>Point da Aldeia';
      ir('dashboard');
    }
  }
});

/* =============================================

   ============================================= */
const TITLES = {
  dashboard: 'Dashboard',

  pedidos: 'Pedidos via WhatsApp',
  horarios: 'Hor\u00e1rios de Funcionamento',
  config: 'Configura\u00e7\u00f5es da Loja'
};

function ir(section) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const navEl = document.getElementById('nav-' + section);
  if (navEl) navEl.classList.add('active');
  document.getElementById('topbarTitle').textContent = TITLES[section] || section;
  const fns = { dashboard, categorias, produtos, pedidos, horarios, config };
  if (fns[section]) fns[section]();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function getStore(key, def) {
  try {
    const val = localStorage.getItem(key);
    if (val === null) return def;
    return JSON.parse(val);
  } catch { return def; }
}
function setStore(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

/* Popula dados padrão na primeira vez */
function initDefaultData() {
  // Versão dos dados — incrementar aqui força reset do cardápio
  const DATA_VERSION = '3';
  const storedVersion = localStorage.getItem('pda_data_version');

  if (storedVersion !== DATA_VERSION) {
    // Dados desatualizados ou primeira vez: reseta categorias e produtos
    setStore('categorias', CATS_DEFAULT);
    setStore('produtos', PRODS_DEFAULT);
    localStorage.setItem('pda_data_version', DATA_VERSION);
    localStorage.setItem('pda_initialized', '1');
  }
}

/* =============================================
   IMAGEM PRODUTO
   ============================================= */
function previewImagem(input) {
  const file = input.files ? input.files[0] : input;
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('Imagem muito grande. Máx. 10MB.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result;
    const b64el  = document.getElementById('pImagemBase64');
    const prevImg = document.getElementById('imgPreviewImg');
    const prevBox = document.getElementById('imgPreview');
    const prevWrap = document.getElementById('imgPreviewWrap');
    if (b64el)   b64el.value  = base64;
    if (prevImg) prevImg.src  = base64;
    if (prevBox)  prevBox.style.display  = 'none';
    if (prevWrap) prevWrap.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function handleImgDrop(e) {
  e.preventDefault();
  const zone = document.getElementById('imgDropZone');
  if (zone) zone.style.borderColor = 'var(--border)';
  const file = e.dataTransfer?.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  previewImagem(file);
}

function removerImagem() {
  const b64el  = document.getElementById('pImagemBase64');
  const prevImg = document.getElementById('imgPreviewImg');
  const prevBox = document.getElementById('imgPreview');
  const prevWrap = document.getElementById('imgPreviewWrap');
  const inp    = document.getElementById('pImagem');
  if (b64el)   b64el.value  = '';
  if (prevImg) prevImg.src  = '';
  if (inp)     inp.value    = '';
  if (prevBox)  prevBox.style.display  = 'block';
  if (prevWrap) prevWrap.style.display = 'none';
}

/* =============================================

   ============================================= */
function abrirModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function toast(msg, tipo = 'success') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}
function fmtMoeda(v) { return 'R$ ' + (parseFloat(v) || 0).toFixed(2).replace('.', ','); }

function salvarCategoria(id) {
  const nome  = document.getElementById('cNome').value.trim();

  const cats = getStore('categorias', []);

            <td style="color:var(--text2);font-weight:700">#${p.pedNum || (log.length - i)}</td>
            <td><strong>${p.cliente}</strong>${p.tel ? '<br><span style="font-size:.75rem;color:var(--text2)">' + p.tel + '</span>' : ''}</td>
            <td style="max-width:220px;font-size:.82rem">${p.item}</td>
            <td style="font-weight:700;color:var(--success);white-space:nowrap">${p.total || '—'}</td>
            <td><span class="badge badge-info">${p.tipo || '—'}</span></td>
            <td style="font-size:.82rem">${p.pgto || '—'}</td>
            <td style="color:var(--text2);white-space:nowrap;font-size:.82rem">${p.data}<br>${p.hora}</td>
            <td><div class="actions-col">
              ${waLink ? '<a href="' + waLink + '" target="_blank" class="btn-edit" style="font-size:.75rem"><i class="fab fa-whatsapp"></i> Avisar</a>' : ''}
              <button class="btn-danger" onclick="deletarPedido(${p.id})"><i class="fas fa-trash"></i></button>
            </div></td>
          </tr>`;
        }).join('') || '<tr><td colspan="8" class="empty-row">Nenhum pedido registrado ainda.</td></tr>'}
        </tbody>
      </table></div>
    </div>`;
}

function modalNovoPedido() {
  abrirModal(`
    <h2><i class="fab fa-whatsapp"></i> Registrar Pedido</h2>
    <div class="form-group"><label>Nome do Cliente *</label><input type="text" id="pedCliente" required></div>
    <div class="form-group"><label>Item Pedido *</label><input type="text" id="pedItem" placeholder="Ex: Frango à Passarinho" required></div>
    <div class="form-group"><label>Observação</label><input type="text" id="pedObs" placeholder="Ex: Sem cebola"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-primary" onclick="salvarPedido()">Registrar</button>
    </div>`);
}

function salvarPedido() {
  const cliente = document.getElementById('pedCliente').value.trim();
  const item    = document.getElementById('pedItem').value.trim();
  const obs     = document.getElementById('pedObs').value.trim();
  if (!cliente || !item) { toast('Preencha cliente e item', 'error'); return; }
  const now   = new Date();
  const log   = getStore('pedidos_log', []);
  log.push({
    id: Date.now(), cliente, item: item + (obs ? ' (' + obs + ')' : ''),
    data: now.toLocaleDateString('pt-BR'),
    hora: now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  });
  setStore('pedidos_log', log);
  fecharModal(); pedidos();
  toast('Pedido registrado!');
}

function deletarPedido(id) {
  if (!confirm('Remover este pedido do registro?')) return;
  setStore('pedidos_log', getStore('pedidos_log', []).filter(p => p.id !== id));
  pedidos();
  toast('Pedido removido', 'warning');
}

/* =============================================
   HORÁRIOS
   ============================================= */
function horarios() {
  const dias = ['Domingo','Segunda-feira','Ter\u00e7a-feira','Quarta-feira','Quinta-feira','Sexta-feira','S\u00e1bado'];
  const hors = getStore('horarios', dias.map((d,i) => ({ dia: i, nome: d, abertura: '11:00', fechamento: '20:00', aberto: true })));

  document.getElementById('adminContent').innerHTML = `
    <div class="table-card" style="max-width:680px">
      <div class="table-header"><h2><i class="fas fa-clock"></i> Horários de Funcionamento</h2></div>
      <div style="padding:1.25rem">
        <table style="width:100%">
          <thead><tr><th>Dia</th><th>Abertura</th><th>Fechamento</th><th>Aberto</th></tr></thead>
          <tbody>
            ${hors.map(h => `
              <tr>
                <td style="font-weight:600">${h.nome}</td>
                <td><input type="time" id="ab${h.dia}" value="${h.abertura}" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.35rem .6rem;font-size:.85rem"></td>
                <td><input type="time" id="fc${h.dia}" value="${h.fechamento}" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.35rem .6rem;font-size:.85rem"></td>
                <td><label class="toggle-switch"><input type="checkbox" id="op${h.dia}" ${h.aberto ? 'checked' : ''}><span class="toggle-track"></span></label></td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:1.25rem">
          <button class="btn-primary" onclick="salvarHorarios()"><i class="fas fa-save"></i> Salvar Horários</button>
        </div>
      </div>
    </div>`;
}

function salvarHorarios() {
  const dias = ['Domingo','Segunda-feira','Ter\u00e7a-feira','Quarta-feira','Quinta-feira','Sexta-feira','S\u00e1bado'];
  const hors = dias.map((nome, i) => ({
    dia: i, nome,
    abertura:    document.getElementById('ab' + i)?.value || '11:00',
    fechamento:  document.getElementById('fc' + i)?.value || '20:00',
    aberto:      document.getElementById('op' + i)?.checked ?? true
  }));
  setStore('horarios', hors);
  toast('Horários salvos!');
}

    <div class="table-card" style="max-width:680px">

      <div style="padding:1.25rem">

function aplicarCor(cor) {
  localStorage.setItem('pda_cor_tema', cor);

  // Aplica no admin agora
  document.documentElement.style.setProperty('--primary', cor);
  var hex = cor.replace('#','');
  var r = parseInt(hex.substring(0,2),16);
  var g = parseInt(hex.substring(2,4),16);
  var b = parseInt(hex.substring(4,6),16);
  var escuro = 'rgb('+Math.max(0,r-30)+','+Math.max(0,g-30)+','+Math.max(0,b-30)+')';
  document.documentElement.style.setProperty('--primary-d', escuro);

  // Salva no tema.css via fetch (funciona no GitHub Pages)
  var css = '/* COR TEMA - alterada pelo admin */\n:root {\n  --primary: ' + cor + ';\n  --primary-d: ' + escuro + ';\n}\n';

  // Tenta salvar localmente via API do servidor (se disponível)
  fetch('salvar-tema.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ css: css })
  }).catch(function() {});

  // Salva no localStorage para aplicar localmente
  localStorage.setItem('pda_tema_css', css);

  // Envia para outras abas
  try {
    var bc = new BroadcastChannel('pda_tema');
    bc.postMessage({ cor: cor });
    bc.close();
  } catch(err) {}

  // Atualiza hex exibido
  var hexEl = document.getElementById('corHex');
  if (hexEl) hexEl.textContent = cor;

  // Atualiza bordas da paleta
  document.querySelectorAll('#coresPaleta button').forEach(function(btn) {
    var m = btn.getAttribute('onclick').match(/'([^']+)'/);
    if (!m) return;
    var btnCor = m[1];
    btn.style.border = btnCor === cor ? '3px solid #fff' : '3px solid transparent';
    btn.style.outline = btnCor === cor ? '3px solid ' + cor : 'none';
  });

  // Mostra instrução para publicar
  toast('Cor aplicada! Execute o AUTO-PUBLICAR para todos verem.', 'success');

  // Gera o arquivo tema.css para download automático
  var blob = new Blob([css], { type: 'text/css' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'tema.css';
  a.click();
  URL.revokeObjectURL(url);
}

/* Tecla ESC fecha modal */
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
