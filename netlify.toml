# =============================================
# POINT DA ALDEIA – netlify.toml
# Headers de segurança
# =============================================

[[headers]]
  for = "/*"
  [headers.values]
    # Força HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Bloqueia ser carregado dentro de iframe (clickjacking)
    X-Frame-Options = "DENY"
    # Impede detecção errada de tipo MIME
    X-Content-Type-Options = "nosniff"
    # Controle de referrer
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissões do navegador
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Remove header que expõe tecnologia
    X-Powered-By = ""
    # Cross-Origin
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://viacep.com.br; frame-ancestors 'none';"

# Bloqueia acesso direto a arquivos sensíveis
[[headers]]
  for = "/.netlify/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache para assets estáticos
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Sem cache para HTML (sempre atualizado)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redireciona HTTP para HTTPS
[[redirects]]
  from = "http://point-da-aldeia.netlify.app/*"
  to   = "https://point-da-aldeia.netlify.app/:splat"
  status = 301
  force  = true
